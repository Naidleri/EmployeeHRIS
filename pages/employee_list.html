<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee List</title>
  <link rel="stylesheet" href="css/employee.css">
</head>
<body>

  <h1 class="page-title">Employee List</h1>

  <div class="notification-banner" id="notification-banner"></div>

  <div class="top-bar">
    <div class="tab-group">
      <button class="tab-btn active" data-tab="active">Active</button>
      <button class="tab-btn" data-tab="resigned">Resigned</button>
    </div>
    <div class="top-bar-actions">
      <button class="edit-multiple-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit Multiple Data
      </button>
      <button class="action-dropdown-btn">
        Action
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="search" placeholder="Search name, ID, or position here" id="search-input">
    </div>
    <button class="filter-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="6" x2="20" y2="6"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
        <line x1="11" y1="18" x2="13" y2="18"/>
      </svg>
      Filter
    </button>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Employee Name</th>
        <th>Status</th>
        <th>Branch</th>
        <th>Department</th>
        <th>Position</th>
        <th>Join Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="employee-table-body"></tbody>
  </table>

  <div class="empty-state" id="empty-state" style="display:none">
    <img src="assets/404.png" alt="No data">
    <h3>No Employees Found</h3>
    <p>No employees match your search.</p>
  </div>

</body>
</html>
